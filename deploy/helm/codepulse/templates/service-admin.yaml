apiVersion: v1
kind: Service
metadata:
  name: {{ include "codepulse.fullname" . }}-admin
  labels:
    {{- include "codepulse.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.admin.port }}
      targetPort: http-admin
      protocol: TCP
      name: http-admin
  selector:
    {{- include "codepulse.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: admin
