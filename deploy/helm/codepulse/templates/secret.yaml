{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "codepulse.fullname" . }}-secrets
  labels:
    {{- include "codepulse.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_PASSWORD: {{ .Values.secrets.databasePassword | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  GITHUB_WEBHOOK_SECRET: {{ .Values.secrets.githubWebhookSecret | quote }}
  ADMIN_API_KEY: {{ .Values.secrets.adminApiKey | quote }}
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | quote }}
  github-app-key.pem: {{ .Values.secrets.githubAppPrivateKey | quote }}
{{- end }}
{{- if .Values.secrets.sealedSecret.enabled }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ include "codepulse.fullname" . }}-sealed-secrets
  labels:
    {{- include "codepulse.labels" . | nindent 4 }}
spec:
  encryptedData:
    DATABASE_PASSWORD: ""
    REDIS_PASSWORD: ""
    GITHUB_WEBHOOK_SECRET: ""
    ADMIN_API_KEY: ""
    GEMINI_API_KEY: ""
    github-app-key.pem: ""
  template:
    metadata:
      name: {{ include "codepulse.fullname" . }}-secrets
      labels:
        {{- include "codepulse.labels" . | nindent 8 }}
{{- end }}
