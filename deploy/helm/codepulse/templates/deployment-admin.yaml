apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "codepulse.fullname" . }}-admin
  labels:
    {{- include "codepulse.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  replicas: {{ .Values.admin.replicaCount }}
  selector:
    matchLabels:
      {{- include "codepulse.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: admin
  template:
    metadata:
      labels:
        {{- include "codepulse.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: admin
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: admin
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn", "codepulse.ingestion.app:app", "--host", "0.0.0.0", "--port", "{{ .Values.admin.port }}"]
          ports:
            - name: http-admin
              containerPort: {{ .Values.admin.port }}
              protocol: TCP
          env:
            - name: SERVICE_NAME
              value: "codepulse-admin"
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "codepulse.fullname" . }}-config
                  key: ENVIRONMENT
            - name: DATABASE_URL
              value: "postgresql://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)"
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "codepulse.fullname" . }}-config
                  key: DATABASE_HOST
            - name: DATABASE_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "codepulse.fullname" . }}-config
                  key: DATABASE_PORT
            - name: DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "codepulse.fullname" . }}-config
                  key: DATABASE_NAME
            - name: DATABASE_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "codepulse.fullname" . }}-config
                  key: DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "codepulse.fullname" . }}-secrets
                  key: DATABASE_PASSWORD
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)/$(REDIS_DB)"
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "codepulse.fullname" . }}-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "codepulse.fullname" . }}-config
                  key: REDIS_PORT
            - name: REDIS_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ include "codepulse.fullname" . }}-config
                  key: REDIS_DB
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "codepulse.fullname" . }}-secrets
                  key: REDIS_PASSWORD
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "codepulse.fullname" . }}-secrets
                  key: ADMIN_API_KEY
          resources:
            {{- toYaml .Values.admin.resources | nindent 12 }}
