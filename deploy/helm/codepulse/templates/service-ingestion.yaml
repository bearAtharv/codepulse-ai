apiVersion: v1
kind: Service
metadata:
  name: {{ include "codepulse.fullname" . }}-ingestion
  labels:
    {{- include "codepulse.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingestion
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.ingestion.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.ingestion.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "codepulse.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ingestion
