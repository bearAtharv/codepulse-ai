apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "codepulse.fullname" . }}-config
  labels:
    {{- include "codepulse.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.global.environment | quote }}
  DATABASE_HOST: {{ .Values.config.databaseHost | quote }}
  DATABASE_PORT: {{ .Values.config.databasePort | quote }}
  DATABASE_NAME: {{ .Values.config.databaseName | quote }}
  DATABASE_USER: {{ .Values.config.databaseUser | quote }}
  REDIS_HOST: {{ .Values.config.redisHost | quote }}
  REDIS_PORT: {{ .Values.config.redisPort | quote }}
  REDIS_DB: {{ .Values.config.redisDb | quote }}
  GITHUB_APP_ID: {{ .Values.config.githubAppId | quote }}
  GITHUB_APP_PRIVATE_KEY_PATH: {{ .Values.config.githubAppPrivateKeyPath | quote }}
  OTEL_TRACING_ENABLED: {{ .Values.config.tracingEnabled | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.tempoEndpoint | quote }}
