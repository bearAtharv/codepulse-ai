global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/recording_rules.yml

scrape_configs:
  - job_name: "codepulse-web"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["web:9090"]

  - job_name: "codepulse-worker"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["worker:9091"]
