apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    uid: LOKI_DEFAULT
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: TEMPO_DEFAULT
          matcherRegex: '"trace_id":\s*"([a-f0-9]{32})"'
          name: TraceID
          url: '$${__value.raw}'
