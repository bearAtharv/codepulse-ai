services:
  postgres:
    image: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: codepulse
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-codepulse_dev}"
      POSTGRES_DB: codepulse
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codepulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2.17-alpine@sha256:4517169c589fb91a3630f9e0a129cd407c7bd8596f9e67dcb9e4af167ce2f9c5
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: "postgresql://codepulse:${POSTGRES_PASSWORD:-codepulse_dev}@postgres:5432/codepulse"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      GITHUB_WEBHOOK_SECRET: "dev_webhook_secret_not_for_production"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "codepulse.ingestion.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./secrets:/secrets:ro
    environment:
      DATABASE_URL: "postgresql://codepulse:${POSTGRES_PASSWORD:-codepulse_dev}@postgres:5432/codepulse"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      GITHUB_WEBHOOK_SECRET: "dev_webhook_secret_not_for_production"
      ADMIN_API_KEY: "dev_admin_key_not_for_production"
      GITHUB_APP_ID: "${GITHUB_APP_ID:-0}"
      GITHUB_APP_PRIVATE_KEY_PATH: "${GITHUB_APP_PRIVATE_KEY_PATH:-/secrets/github-app-key.pem}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      ENVIRONMENT: "development"
      SERVICE_NAME: "codepulse-web"
      METRICS_PORT: "9090"
      MOCK_GITHUB: "true"
      MOCK_LLM: "true"
      MOCK_LLM_FAILURE: "${MOCK_LLM_FAILURE:-false}"
      MOCK_RATE_LIMIT: "${MOCK_RATE_LIMIT:-false}"
      MOCK_RATE_LIMIT_WAIT: "${MOCK_RATE_LIMIT_WAIT:-2.0}"
      MOCK_GITHUB_RATE_LIMIT: "${MOCK_GITHUB_RATE_LIMIT:-false}"
      MOCK_GITHUB_RESET_TS: "${MOCK_GITHUB_RESET_TS:-0}"
      GEMINI_RPM_LIMIT: "${GEMINI_RPM_LIMIT:-324}"
      GEMINI_RATE_LIMIT_DEADLINE: "${GEMINI_RATE_LIMIT_DEADLINE:-60.0}"
      MOCK_POSTING_FAILURE: "${MOCK_POSTING_FAILURE:-false}"
      MOCK_QUICK_RETRIES: "${MOCK_QUICK_RETRIES:-false}"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["celery", "-A", "codepulse.worker.celery_app", "worker", "-l", "info", "-Q", "cp-high,cp-analysis,cp-aggregate,cp-retry", "-c", "4"]
    volumes:
      - ./secrets:/secrets:ro
    environment:
      DATABASE_URL: "postgresql://codepulse:${POSTGRES_PASSWORD:-codepulse_dev}@postgres:5432/codepulse"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      GITHUB_WEBHOOK_SECRET: "dev_webhook_secret_not_for_production"
      ADMIN_API_KEY: "dev_admin_key_not_for_production"
      GITHUB_APP_ID: "${GITHUB_APP_ID:-0}"
      GITHUB_APP_PRIVATE_KEY_PATH: "${GITHUB_APP_PRIVATE_KEY_PATH:-/secrets/github-app-key.pem}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      ENVIRONMENT: "development"
      SERVICE_NAME: "codepulse-worker"
      WORKER_METRICS_PORT: "9091"
      PROMETHEUS_MULTIPROC_DIR: "/tmp/prometheus_multiproc"
      MOCK_GITHUB: "true"
      MOCK_LLM: "true"
      MOCK_LLM_FAILURE: "${MOCK_LLM_FAILURE:-false}"
      MOCK_RATE_LIMIT: "${MOCK_RATE_LIMIT:-false}"
      MOCK_RATE_LIMIT_WAIT: "${MOCK_RATE_LIMIT_WAIT:-2.0}"
      MOCK_GITHUB_RATE_LIMIT: "${MOCK_GITHUB_RATE_LIMIT:-false}"
      MOCK_GITHUB_RESET_TS: "${MOCK_GITHUB_RESET_TS:-0}"
      GEMINI_RPM_LIMIT: "${GEMINI_RPM_LIMIT:-324}"
      GEMINI_RATE_LIMIT_DEADLINE: "${GEMINI_RATE_LIMIT_DEADLINE:-60.0}"
      MOCK_POSTING_FAILURE: "${MOCK_POSTING_FAILURE:-false}"
      MOCK_QUICK_RETRIES: "${MOCK_QUICK_RETRIES:-false}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["celery", "-A", "codepulse.worker.celery_app", "beat", "-l", "info"]
    volumes:
      - ./secrets:/secrets:ro
    environment:
      DATABASE_URL: "postgresql://codepulse:${POSTGRES_PASSWORD:-codepulse_dev}@postgres:5432/codepulse"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      GITHUB_WEBHOOK_SECRET: "dev_webhook_secret_not_for_production"
      ADMIN_API_KEY: "dev_admin_key_not_for_production"
      GITHUB_APP_ID: "${GITHUB_APP_ID:-0}"
      GITHUB_APP_PRIVATE_KEY_PATH: "${GITHUB_APP_PRIVATE_KEY_PATH:-/secrets/github-app-key.pem}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      ENVIRONMENT: "development"
      SERVICE_NAME: "codepulse-beat"
      MOCK_GITHUB: "true"
      MOCK_LLM: "true"
      MOCK_LLM_FAILURE: "${MOCK_LLM_FAILURE:-false}"
      MOCK_RATE_LIMIT: "${MOCK_RATE_LIMIT:-false}"
      MOCK_RATE_LIMIT_WAIT: "${MOCK_RATE_LIMIT_WAIT:-2.0}"
      MOCK_GITHUB_RATE_LIMIT: "${MOCK_GITHUB_RATE_LIMIT:-false}"
      MOCK_GITHUB_RESET_TS: "${MOCK_GITHUB_RESET_TS:-0}"
      GEMINI_RPM_LIMIT: "${GEMINI_RPM_LIMIT:-324}"
      GEMINI_RATE_LIMIT_DEADLINE: "${GEMINI_RATE_LIMIT_DEADLINE:-60.0}"
      MOCK_POSTING_FAILURE: "${MOCK_POSTING_FAILURE:-false}"
      MOCK_QUICK_RETRIES: "${MOCK_QUICK_RETRIES:-false}"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    ports:
      - "127.0.0.1:9092:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    depends_on:
      - web
      - worker

  grafana:
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_UNIFIED_STORAGE_OVERRIDES_PATH: "/etc/grafana/overrides.yaml"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/overrides.yaml:/etc/grafana/overrides.yaml:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    user: "0:0"
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./deploy/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/tmp/loki
    command: ["-config.file=/etc/loki/local-config.yaml"]

  alloy:
    image: grafana/alloy:v1.21.2@sha256:89a5a320168387336b9ac3c850609c3ba7757eadd4ae5f1d819deb35e9854b18
    volumes:
      - ./deploy/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    depends_on:
      - loki

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:
