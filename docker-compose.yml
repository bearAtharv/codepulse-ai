services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: codepulse
      POSTGRES_PASSWORD: codepulse_dev
      POSTGRES_DB: codepulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codepulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: "postgresql://codepulse:codepulse_dev@postgres:5432/codepulse"
      REDIS_URL: "redis://redis:6379/0"
      GITHUB_WEBHOOK_SECRET: "dev_webhook_secret_not_for_production"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "codepulse.ingestion.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
      - "9090:9090"
    environment:
      DATABASE_URL: "postgresql://codepulse:codepulse_dev@postgres:5432/codepulse"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      GITHUB_WEBHOOK_SECRET: "dev_webhook_secret_not_for_production"
      ADMIN_API_KEY: "dev_admin_key_not_for_production"
      ENVIRONMENT: "development"
      METRICS_PORT: "9090"
      MOCK_GITHUB: "true"
      MOCK_LLM: "true"
      MOCK_LLM_FAILURE: "${MOCK_LLM_FAILURE:-false}"
      MOCK_RATE_LIMIT: "${MOCK_RATE_LIMIT:-false}"
      MOCK_RATE_LIMIT_WAIT: "${MOCK_RATE_LIMIT_WAIT:-2.0}"
      MOCK_GITHUB_RATE_LIMIT: "${MOCK_GITHUB_RATE_LIMIT:-false}"
      MOCK_GITHUB_RESET_TS: "${MOCK_GITHUB_RESET_TS:-0}"
      GEMINI_RPM_LIMIT: "${GEMINI_RPM_LIMIT:-324}"
      GEMINI_RATE_LIMIT_DEADLINE: "${GEMINI_RATE_LIMIT_DEADLINE:-60.0}"
      MOCK_POSTING_FAILURE: "${MOCK_POSTING_FAILURE:-false}"
      MOCK_QUICK_RETRIES: "${MOCK_QUICK_RETRIES:-false}"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["celery", "-A", "codepulse.worker.celery_app", "worker", "-l", "info", "-Q", "cp-high,cp-analysis,cp-aggregate,cp-retry", "-c", "4"]
    ports:
      - "9091:9091"
    environment:
      DATABASE_URL: "postgresql://codepulse:codepulse_dev@postgres:5432/codepulse"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      GITHUB_WEBHOOK_SECRET: "dev_webhook_secret_not_for_production"
      ADMIN_API_KEY: "dev_admin_key_not_for_production"
      ENVIRONMENT: "development"
      WORKER_METRICS_PORT: "9091"
      PROMETHEUS_MULTIPROC_DIR: "/tmp/prometheus_multiproc"
      MOCK_GITHUB: "true"
      MOCK_LLM: "true"
      MOCK_LLM_FAILURE: "${MOCK_LLM_FAILURE:-false}"
      MOCK_RATE_LIMIT: "${MOCK_RATE_LIMIT:-false}"
      MOCK_RATE_LIMIT_WAIT: "${MOCK_RATE_LIMIT_WAIT:-2.0}"
      MOCK_GITHUB_RATE_LIMIT: "${MOCK_GITHUB_RATE_LIMIT:-false}"
      MOCK_GITHUB_RESET_TS: "${MOCK_GITHUB_RESET_TS:-0}"
      GEMINI_RPM_LIMIT: "${GEMINI_RPM_LIMIT:-324}"
      GEMINI_RATE_LIMIT_DEADLINE: "${GEMINI_RATE_LIMIT_DEADLINE:-60.0}"
      MOCK_POSTING_FAILURE: "${MOCK_POSTING_FAILURE:-false}"
      MOCK_QUICK_RETRIES: "${MOCK_QUICK_RETRIES:-false}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["celery", "-A", "codepulse.worker.celery_app", "beat", "-l", "info"]
    environment:
      DATABASE_URL: "postgresql://codepulse:codepulse_dev@postgres:5432/codepulse"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      GITHUB_WEBHOOK_SECRET: "dev_webhook_secret_not_for_production"
      ADMIN_API_KEY: "dev_admin_key_not_for_production"
      ENVIRONMENT: "development"
      MOCK_GITHUB: "true"
      MOCK_LLM: "true"
      MOCK_LLM_FAILURE: "${MOCK_LLM_FAILURE:-false}"
      MOCK_RATE_LIMIT: "${MOCK_RATE_LIMIT:-false}"
      MOCK_RATE_LIMIT_WAIT: "${MOCK_RATE_LIMIT_WAIT:-2.0}"
      MOCK_GITHUB_RATE_LIMIT: "${MOCK_GITHUB_RATE_LIMIT:-false}"
      MOCK_GITHUB_RESET_TS: "${MOCK_GITHUB_RESET_TS:-0}"
      GEMINI_RPM_LIMIT: "${GEMINI_RPM_LIMIT:-324}"
      GEMINI_RATE_LIMIT_DEADLINE: "${GEMINI_RATE_LIMIT_DEADLINE:-60.0}"
      MOCK_POSTING_FAILURE: "${MOCK_POSTING_FAILURE:-false}"
      MOCK_QUICK_RETRIES: "${MOCK_QUICK_RETRIES:-false}"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9092:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    depends_on:
      - web
      - worker

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
