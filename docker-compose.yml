services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: codepulse
      POSTGRES_PASSWORD: codepulse_dev
      POSTGRES_DB: codepulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codepulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2.17-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: "postgresql://codepulse:codepulse_dev@postgres:5432/codepulse"
      REDIS_URL: "redis://redis:6379/0"
      GITHUB_WEBHOOK_SECRET: "dev_webhook_secret_not_for_production"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "codepulse.ingestion.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql://codepulse:codepulse_dev@postgres:5432/codepulse"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      GITHUB_WEBHOOK_SECRET: "dev_webhook_secret_not_for_production"
      ADMIN_API_KEY: "dev_admin_key_not_for_production"
      ENVIRONMENT: "development"
      SERVICE_NAME: "codepulse-web"
      METRICS_PORT: "9090"
      MOCK_GITHUB: "true"
      MOCK_LLM: "true"
      MOCK_LLM_FAILURE: "${MOCK_LLM_FAILURE:-false}"
      MOCK_RATE_LIMIT: "${MOCK_RATE_LIMIT:-false}"
      MOCK_RATE_LIMIT_WAIT: "${MOCK_RATE_LIMIT_WAIT:-2.0}"
      MOCK_GITHUB_RATE_LIMIT: "${MOCK_GITHUB_RATE_LIMIT:-false}"
      MOCK_GITHUB_RESET_TS: "${MOCK_GITHUB_RESET_TS:-0}"
      GEMINI_RPM_LIMIT: "${GEMINI_RPM_LIMIT:-324}"
      GEMINI_RATE_LIMIT_DEADLINE: "${GEMINI_RATE_LIMIT_DEADLINE:-60.0}"
      MOCK_POSTING_FAILURE: "${MOCK_POSTING_FAILURE:-false}"
      MOCK_QUICK_RETRIES: "${MOCK_QUICK_RETRIES:-false}"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["celery", "-A", "codepulse.worker.celery_app", "worker", "-l", "info", "-Q", "cp-high,cp-analysis,cp-aggregate,cp-retry", "-c", "4"]
    environment:
      DATABASE_URL: "postgresql://codepulse:codepulse_dev@postgres:5432/codepulse"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      GITHUB_WEBHOOK_SECRET: "dev_webhook_secret_not_for_production"
      ADMIN_API_KEY: "dev_admin_key_not_for_production"
      ENVIRONMENT: "development"
      SERVICE_NAME: "codepulse-worker"
      WORKER_METRICS_PORT: "9091"
      PROMETHEUS_MULTIPROC_DIR: "/tmp/prometheus_multiproc"
      MOCK_GITHUB: "true"
      MOCK_LLM: "true"
      MOCK_LLM_FAILURE: "${MOCK_LLM_FAILURE:-false}"
      MOCK_RATE_LIMIT: "${MOCK_RATE_LIMIT:-false}"
      MOCK_RATE_LIMIT_WAIT: "${MOCK_RATE_LIMIT_WAIT:-2.0}"
      MOCK_GITHUB_RATE_LIMIT: "${MOCK_GITHUB_RATE_LIMIT:-false}"
      MOCK_GITHUB_RESET_TS: "${MOCK_GITHUB_RESET_TS:-0}"
      GEMINI_RPM_LIMIT: "${GEMINI_RPM_LIMIT:-324}"
      GEMINI_RATE_LIMIT_DEADLINE: "${GEMINI_RATE_LIMIT_DEADLINE:-60.0}"
      MOCK_POSTING_FAILURE: "${MOCK_POSTING_FAILURE:-false}"
      MOCK_QUICK_RETRIES: "${MOCK_QUICK_RETRIES:-false}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["celery", "-A", "codepulse.worker.celery_app", "beat", "-l", "info"]
    environment:
      DATABASE_URL: "postgresql://codepulse:codepulse_dev@postgres:5432/codepulse"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      GITHUB_WEBHOOK_SECRET: "dev_webhook_secret_not_for_production"
      ADMIN_API_KEY: "dev_admin_key_not_for_production"
      ENVIRONMENT: "development"
      SERVICE_NAME: "codepulse-beat"
      MOCK_GITHUB: "true"
      MOCK_LLM: "true"
      MOCK_LLM_FAILURE: "${MOCK_LLM_FAILURE:-false}"
      MOCK_RATE_LIMIT: "${MOCK_RATE_LIMIT:-false}"
      MOCK_RATE_LIMIT_WAIT: "${MOCK_RATE_LIMIT_WAIT:-2.0}"
      MOCK_GITHUB_RATE_LIMIT: "${MOCK_GITHUB_RATE_LIMIT:-false}"
      MOCK_GITHUB_RESET_TS: "${MOCK_GITHUB_RESET_TS:-0}"
      GEMINI_RPM_LIMIT: "${GEMINI_RPM_LIMIT:-324}"
      GEMINI_RATE_LIMIT_DEADLINE: "${GEMINI_RATE_LIMIT_DEADLINE:-60.0}"
      MOCK_POSTING_FAILURE: "${MOCK_POSTING_FAILURE:-false}"
      MOCK_QUICK_RETRIES: "${MOCK_QUICK_RETRIES:-false}"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v3.15.1
    ports:
      - "127.0.0.1:9092:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    depends_on:
      - web
      - worker

  grafana:
    image: grafana/grafana:13.3.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:3.7.9
    user: "0:0"
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./deploy/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/tmp/loki
    command: ["-config.file=/etc/loki/local-config.yaml"]

  alloy:
    image: grafana/alloy:v1.21.2
    volumes:
      - ./deploy/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    depends_on:
      - loki

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:
